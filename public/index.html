<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.WHARF_SERVER = true;</script>
<title>SB Truckin · Wharf Invoices</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wharf Invoices">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: matches SBT Driver Pay. Ink top bar with the SB red stripe, light grey ground, white cards, red for the main action. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#15181C; --muted:#5F6872; --line:#DDE1E5;
  --mast:#15181C; --mast-ink:#FFFFFF; --mast-muted:#9AA3AD; --stripe:#E10600;
  --primary:#15181C; --on-primary:#FFFFFF; --accent:#E10600; --on-accent:#FFFFFF;
  --good:#11683A; --good-bg:#D6F2E1; --warn:#7A5B00; --warn-bg:#FFF3CD; --bad:#A3141A; --bad-bg:#FBDCDD;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Barlow",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#181B20; --surface-2:#1F2329; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2C3239;
  --mast:#15181C; --mast-ink:#FFFFFF; --mast-muted:#9AA3AD; --stripe:#E10600;
  --primary:#E8EBEE; --on-primary:#15181C; --accent:#E8231A; --on-accent:#FFFFFF;
  --good:#5CC98C; --good-bg:#12301F; --warn:#E8C25C; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --surface-2:#1F2329; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2C3239;
  --mast:#15181C; --mast-ink:#FFFFFF; --mast-muted:#9AA3AD; --stripe:#E10600;
  --primary:#E8EBEE; --on-primary:#15181C; --accent:#E8231A; --on-accent:#FFFFFF;
  --good:#5CC98C; --good-bg:#12301F; --warn:#E8C25C; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mast)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mast);color:var(--mast-ink);border-bottom:4px solid var(--stripe)}
.mast-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{height:32px;width:auto;flex:none;display:block}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;white-space:nowrap;line-height:1.1}
.brand-sub{font-size:12px;color:var(--mast-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav button{background:none;border:0;color:var(--mast-muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.topnav button:hover{color:var(--mast-ink);background:rgba(255,255,255,.06)}
.topnav button[aria-current="true"]{color:var(--mast-ink);background:rgba(255,255,255,.12)}
.sync{font-size:11px;color:var(--mast-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mast-muted);display:inline-block}
.sync.cloud i{background:#5CC892}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-out{background:none;border:1px solid var(--mast-muted);color:var(--mast-ink);border-radius:6px;font:inherit;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.hdr-out[hidden]{display:none}

/* bottom tabs (phone) */
.tabs{display:none}
@media (max-width:720px){
  .topnav{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
  .tabs button.new{color:var(--accent)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important}
  .sync span{display:none}
}

main{max-width:1100px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* type */
h1{text-transform:uppercase;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;letter-spacing:.03em;text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.iconbtn svg{width:17px;height:17px}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:18px}
.stack{display:grid;gap:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
label.f{display:grid;gap:5px;min-width:0}
label.f > span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px;font-size:15px}
.in:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.in{resize:vertical;min-height:70px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-mono);font-size:clamp(17px,2.6vw,24px);font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .in{flex:1 1 220px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* invoice list */
.ilist{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.irow{display:grid;grid-template-columns:110px minmax(0,1fr) 130px 120px 96px;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.irow:first-child{border-top:0}
.irow:hover{background:var(--surface-2)}
.irow .no{font-family:var(--f-mono);font-weight:500;font-size:14px}
.irow .co{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .sub{font-size:12.5px;color:var(--muted)}
.irow .amt{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.ihead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:default;background:var(--surface-2)}
.ihead:hover{background:var(--surface-2)}
@media (max-width:720px){
  .irow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .irow .c-week{display:none}
  .irow .c-main{grid-column:1}
  .irow .no{grid-row:1}
  .irow .amt{grid-column:2;grid-row:1}
  .irow .pillwrap{grid-column:2;grid-row:2;justify-self:end}
  .ihead{display:none}
}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.paid{background:var(--good-bg);color:var(--good)}
.pill.unpaid{background:var(--warn-bg);color:var(--warn)}
.pill.overdue{background:var(--bad-bg);color:var(--bad)}
.pill.draft{background:var(--surface-2);color:var(--muted)}

.empty{text-align:center;padding:48px 20px;display:grid;gap:10px;justify-items:center}
.empty svg{width:56px;height:56px;color:var(--muted);opacity:.6}

/* companies */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ccard{padding:16px 18px;display:grid;gap:8px;align-content:start}
.ccard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ccard h3{margin:0;font-size:16px;font-weight:600}
.ccard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.ccard dt{color:var(--muted)}
.ccard dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}

/* editor */
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:900px){.ed-grid{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px}
@media (max-width:900px){.side{position:static}}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:10px 10px 10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.item-fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(var(--fw,120px),1fr))}
.item-fields label.f > span{font-size:11px}
.item-fields .in{min-height:38px;padding:7px 9px;font-size:14.5px;background:var(--surface)}
.item-fields .w-wide{grid-column:span 2}
.item-amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;padding:8px 9px;min-height:38px;border-radius:8px;background:var(--surface);border:1px dashed var(--line);text-align:right}
.item-tools{display:flex;flex-direction:column;gap:2px}
.item-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill.load{background:var(--primary);color:var(--on-primary)}
.pill.load[data-n="2"]{background:#2E75B6;color:#fff}
.pill.load[data-n="3"]{background:#1D7A4C;color:#fff}
.pill.load[data-n="4"]{background:#C26A00;color:#fff}
.item-head .btn{font-size:12.5px}
.over-tick{font-size:13px;font-weight:600}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow:auto;min-width:200px}
.sugg[hidden]{display:none}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 11px;font:inherit;font-size:14px;color:var(--ink,inherit);text-align:left;cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--surface-2)}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.item.over{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
@media (max-width:560px){.item-fields .w-wide{grid-column:1/-1}}
.totals{display:grid;gap:8px;font-size:14.5px}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .grand{border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;font-family:var(--f-display);font-weight:750;font-size:20px}
.totals .grand .num{font-weight:500}
.billto-pick{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.billto-pick label{flex:1 1 220px}

/* preview sheet */
.prev-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.prev-bar .spacer{flex:1}
.sheet-wrap{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.sheet-hint{display:none;font-size:12.5px;margin:0 0 8px}
@media (max-width:720px){.sheet-hint{display:block}}
.sheet{background:#fff;color:#14202B;width:100%;min-width:680px;max-width:820px;margin:0 auto;min-height:960px;padding:52px 54px;box-shadow:var(--shadow);border-radius:4px;
  font-family:Helvetica,Arial,sans-serif;font-size:11.5px;line-height:1.45;display:flex;flex-direction:column}
.sheet .s-top{display:flex;justify-content:space-between;gap:4%;align-items:flex-start}
.sheet .s-logo{height:3.6em;width:auto;display:block;margin-bottom:.6em}
.sheet .s-biz{font-size:1.9em;font-weight:700;color:#15181C;line-height:1.15}
.sheet .s-title{font-size:2.3em;font-weight:700;letter-spacing:.06em;color:#15181C;text-align:right}
.sheet .s-meta{display:grid;grid-template-columns:auto auto;gap:.2em 1.2em;justify-content:end;margin-top:.8em}
.sheet .s-meta span:nth-child(odd){color:#5E6E7D;text-align:right}
.sheet .s-meta span:nth-child(even){font-weight:700;text-align:right}
.sheet .s-rule{height:3px;background:#15181C;margin:1.6em 0 1.4em;box-shadow:0 3px 0 #E10600}
.sheet .s-label{font-size:.85em;letter-spacing:.12em;text-transform:uppercase;color:#5E6E7D;font-weight:700;margin-bottom:.3em}
.sheet .s-bill{white-space:pre-line}
.sheet table{width:100%;border-collapse:collapse;margin-top:1.6em;table-layout:fixed}
.sheet th{background:#15181C;color:#fff;font-weight:700;text-align:left;padding:.55em .6em;font-size:.92em}
.sheet td{white-space:pre-line;padding:.5em .6em;border-bottom:1px solid #E1E6EB;vertical-align:top;overflow-wrap:anywhere}
.sheet tr:nth-child(even) td{background:#F5F7F9}
.sheet .r{text-align:right}
.sheet .s-tot{margin-left:auto;width:42%;margin-top:1.2em;display:grid;gap:.35em}
.sheet .s-tot div{display:flex;justify-content:space-between}
.sheet .s-tot .g{border-top:2px solid #15181C;padding-top:.5em;font-weight:700;font-size:1.25em;color:#15181C}
.sheet .s-foot{margin-top:auto;padding-top:2em;display:grid;grid-template-columns:1fr 1fr;gap:4%}
.sheet .s-notes{white-space:pre-line}
.sheet .s-paid{display:inline-block;border:2px solid #1D7A4C;color:#1D7A4C;font-weight:700;letter-spacing:.15em;padding:.2em .8em;border-radius:4px;margin-top:.6em}

/* columns editor */
.cols{display:grid;gap:8px}
.colrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.colrow .in{min-height:36px;padding:6px 9px;font-size:14px;background:var(--surface)}
.colrow .tools{display:flex}
@media (max-width:640px){.colrow{grid-template-columns:1fr 1fr}.colrow .lbl{grid-column:1/-1}.colrow .tools{justify-content:flex-end}}

/* modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,16,24,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .panel-h{position:sticky;top:0;background:var(--surface);z-index:1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:720px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted);gap:10px}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
.notice.ex{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>
<body>
<header class="mast">

function mergeSettings(s){

    columns: Array.isArray(s.columns) && s.columns.length ? s.columns : d.columns};
}

/* ---------- state ---------- */
const state = {settings: mergeSettings(null), companies: [], invoices: [], ready:false, view:'invoices', viewId:null,
  draft:null, filter:'all', q:'', modal:null, settingsDraft:null};

/* ---------- storage: shared db when available, device storage otherwise ---------- */
const LKEY = 'wharf-invoices-v1';
const Store = {
  db:null, mode:'loading', local:{settings:null, companies:{}, invoices:{}},
  async init(){
    if (window.WHARF_SERVER) { this.mode = 'server'; this.syncLabel(); await this.load(); return; }
    if (window.WHARF_FIREBASE) { this.initFirebase(window.WHARF_FIREBASE); return; }
    let db = null;
    for (let i = 0; i < 8 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 150));
    if (window.claude && window.claude.use) { try { db = await window.claude.use('db'); } catch(e) { db = null; } }
    if (db) {
      this.mode = 'cloud';
      this.subscribe(db);
    } else {
      this.mode = 'local';
      try { const raw = localStorage.getItem(LKEY); if (raw) this.local = {...this.local, ...JSON.parse(raw)}; } catch(e) {}
      state.settings = mergeSettings(this.local.settings);
      state.companies = Object.values(this.local.companies || {}).sort((a,b) => String(a.name).localeCompare(b.name));
      state.invoices = Object.values(this.local.invoices || {});
      state.ready = true; render();
    }
    this.syncLabel();
  },
  // Live view of the three record sets. Works with the Claude db and with Firestore, which share this API.
  subscribe(db){
    this.db = db;
    const seen = {s:false, c:false, i:false};
    const ready = () => { if (seen.s && seen.c && seen.i && !state.ready) { state.ready = true; render(); } else if (state.ready) softRender(); };
    const fail = e => { toast('Could not reach your saved data: ' + (e && e.message || 'unknown error')); };
    this.unsubs = [
      db.doc('config/settings').onSnapshot(snap => { state.settings = mergeSettings(snap.exists ? snap.data() : null); seen.s = true; ready(); }, fail),
      db.collection('companies').onSnapshot(snap => { state.companies = snap.docs.map(d => ({...d.data(), id:d.id})).sort((a,b) => String(a.name).localeCompare(b.name)); seen.c = true; ready(); }, fail),
      db.collection('invoices').onSnapshot(snap => { state.invoices = snap.docs.map(d => ({...d.data(), id:d.id})); seen.i = true; ready(); }, fail)
    ];
    setTimeout(() => { if (!state.ready) { state.ready = true; render(); } }, 6000);
  },
  initFirebase(cfg){
    this.mode = 'cloud'; this.syncLabel();
    if (!window.firebase) { state.loadError = 'The sign-in service did not load'; state.ready = true; render(); return; }
    firebase.initializeApp(cfg);
    this.fbAuth = firebase.auth();
    const fs = firebase.firestore();
    try { fs.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch(e) {}
    this.fbAuth.onAuthStateChanged(u => {
      (this.unsubs || []).forEach(f => f()); this.unsubs = [];
      if (!u) { state.auth = {firebase: true}; state.ready = true; render(); return; }
      state.auth = null; state.ready = false; render();
      this.subscribe(fs);
    });
  },
  syncLabel(){
    const sy = $('#sync'), shared = this.mode !== 'local';
    sy.className = 'sync ' + (shared ? 'cloud' : 'local');
    sy.querySelector('span').textContent = shared ? 'Synced' : 'Saved on this device';
    sy.title = shared ? 'Saved to your account. Same data on your phone and computer.' : 'Saved in this browser only.';
  },
  async api(method, url, body){
    const r = await fetch(url, {method, credentials:'same-origin', headers: body ? {'content-type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
    const out = await r.json().catch(() => ({}));
    if (r.status === 401) { state.auth = {setup: !!out.setup}; render(); }
    if (!r.ok) throw new Error(out.error || 'Server error ' + r.status);
    return out;
  },
  async load(){
    let d;
    try { d = await this.api('GET', '/api/data'); }
    catch(e) { if (!state.auth) { state.loadError = e.message; } state.ready = true; render(); return; }
    state.auth = null; state.loadError = null;
    state.settings = mergeSettings(d.settings);
    state.companies = (d.companies || []).sort((a,b) => String(a.name).localeCompare(b.name));
    state.invoices = d.invoices || [];
    if (!state.ready) { state.ready = true; render(); } else softRender();
  },
  persist(){ try { localStorage.setItem(LKEY, JSON.stringify(this.local)); } catch(e) { toast('This browser blocked saving. Export a backup from Settings.'); } },
  async put(col, id, data){
    data = clone(data); delete data.id;
    const list = state[col]; const i = list.findIndex(x => x.id === id);
    if (i >= 0) list[i] = {...data, id}; else list.push({...data, id});
    if (this.mode === 'server') await this.api('PUT', `/api/docs/${col}/${encodeURIComponent(id)}`, data);
    else if (this.mode === 'cloud') await this.db.collection(col).doc(id).set(data);
    else { this.local[col][id] = {...data, id}; this.persist(); }
  },
  async del(col, id){
    state[col] = state[col].filter(x => x.id !== id);
    if (this.mode === 'server') await this.api('DELETE', `/api/docs/${col}/${encodeURIComponent(id)}`);
    else if (this.mode === 'cloud') await this.db.collection(col).doc(id).delete();
    else { delete this.local[col][id]; this.persist(); }
  },
  async putSettings(s){
    state.settings = mergeSettings(clone(s));
    if (this.mode === 'server') await this.api('PUT', '/api/docs/config/settings', clone(state.settings));
    else if (this.mode === 'cloud') await this.db.doc('config/settings').set(clone(state.settings));
    else { this.local.settings = clone(state.settings); this.persist(); }
  }
};
async function safe(p, ok){ try { await p; if (ok) toast(ok); return true; } catch(e) { toast('Not saved: ' + (e && e.message || 'please try again')); return false; } }

/* ---------- invoice maths ---------- */
function waitParams(inv){ const w = {...state.settings.rates, ...((inv && inv.waiting) || {})}; return {free: num(w.freeMinutes), hourly: num(w.hourly), block: num(w.blockMinutes)}; }
function pricing(inv){ const p = {...state.settings.rates, ...((inv && inv.pricing) || {})}; return {perTonne: !!p.perTonne, minTonnes: num(p.minTonnes), fuelLevy: num(p.fuelLevy), oversizePct: num(p.oversizePct)}; }
function toMin(t){ const m = /^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
const fmtHM = m => `${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
function waitInfo(inv, values){
  const cols = inv.columns || state.settings.columns;
  if (!cols.some(c => c.type === 'waiting')) return {mins:null, over:0, charge:0};
  const times = cols.filter(c => c.type === 'time');
  if (times.length < 2) return {mins:null, over:0, charge:0};
  const a = toMin(values[times[0].key]), b = toMin(values[times[1].key]);
  if (a == null || b == null) return {mins:null, over:0, charge:0};
  const mins = b >= a ? b - a : b + 1440 - a;
  const w = waitParams(inv); let over = Math.max(0, mins - w.free); if (w.block > 0) over = Math.floor(over / w.block) * w.block;
  return {mins, over, charge: Math.round(over / 60 * w.hourly * 100) / 100};
}
function cartage(inv, values){
  const cols = inv.columns || state.settings.columns;
  const amt = cols.find(c => c.type === 'amount'); if (!amt) return 0;
  const mult = cols.filter(c => c.multiply && !['amount','waiting'].includes(c.type));
  const pr = pricing(inv), wcol = cols.find(c => c.type === 'weight');
  if (pr.perTonne && wcol && mult.length) {
    const t = Math.max(num(values[wcol.key]) / 1000, pr.minTonnes);
    return Math.round(mult.filter(c => c !== wcol).reduce((p, c) => p * num(values[c.key]), t) * 100) / 100;
  }
  const base = mult.length ? mult.reduce((p, c) => p * num(values[c.key]), 1) : num(values[amt.key]);
  return Math.round(base * 100) / 100;
}
// Oversize / extendable is ticked per load and adds a % on that load's cartage.
function rowOver(inv, row){ return row && row.oversize ? Math.round(cartage(inv, row.values || {}) * pricing(inv).oversizePct) / 100 : 0; }
function rowAmount(inv, values, row){ return Math.round((cartage(inv, values) + rowOver(inv, row) + waitInfo(inv, values).charge) * 100) / 100; }
function totals(inv){
  const items = inv.items || [];
  const cart = items.reduce((s, r) => s + cartage(inv, r.values || {}), 0);
  const dem = items.reduce((s, r) => s + waitInfo(inv, r.values || {}).charge, 0);
  const overPct = pricing(inv).oversizePct, oversize = Math.round(items.reduce((s, r) => s + rowOver(inv, r), 0) * 100) / 100;
  const levyPct = pricing(inv).fuelLevy, levy = Math.round((cart + oversize + dem) * levyPct) / 100;
  const subtotal = Math.round((cart + oversize + dem + levy) * 100) / 100;
  const tax = inv.taxEnabled ? Math.round(subtotal * num(inv.taxRate)) / 100 : 0;
  return {cartage: cart, oversize, overPct, demurrage: dem, levy, levyPct, subtotal, tax, total: subtotal + tax};
}
function totalRows(inv, t){
  const r = [];
  const split = t.levy || t.demurrage || t.oversize;
  if (split) { r.push(['Cartage', t.cartage]); if (t.oversize) r.push([`Oversize / extendable (${t.overPct}%)`, t.oversize]);
    if (t.demurrage) r.push(['Demurrage', t.demurrage]); if (t.levy) r.push([`Fuel levy (${t.levyPct}%)`, t.levy]); }
  r.push([split ? 'Subtotal (ex GST)' : 'Subtotal', t.subtotal]);
  if (inv.taxEnabled) r.push([`${inv.taxLabel} (${inv.taxRate}%)`, t.tax]);
  return r;
}
const zoneSuburbs = z => String(z||'').split('/').map(x => x.trim()).filter(Boolean);
function rateFor(suburb){
  const k = String(suburb||'').trim().toLowerCase(); if (!k) return null;
  const hit = (state.settings.rates.card || []).find(r => String(r.suburb).trim().toLowerCase() === k || zoneSuburbs(r.suburb).some(x => x.toLowerCase() === k));
  return hit ? hit.rate : null;
}
function statusOf(inv){
  if (inv.status === 'paid') return 'paid';
  if (inv.dueDate && inv.dueDate < isoToday()) return 'overdue';
  return 'unpaid';
}
const STATUS_TEXT = {paid:'Paid', unpaid:'Unpaid', overdue:'Overdue'};
// Loads on the same date are numbered 1, 2, 3 in the order they appear.
function loadNo(inv, row){
  const dc = (inv.columns || state.settings.columns).find(c => c.type === 'date'); if (!dc) return 0;
  const day = (row.values || {})[dc.key]; if (!day) return 0;
  const same = (inv.items || []).filter(r => (r.values || {})[dc.key] === day);
  return same.indexOf(row) + 1;
}
// Columns for the preview and PDF: adds a Load column after the date when any day has more than one load.
function outCols(inv){
  let cols = inv.columns || state.settings.columns; const i = cols.findIndex(c => c.type === 'date');
  if (i >= 0 && (inv.items || []).some(r => loadNo(inv, r) > 1)) cols = [...cols.slice(0, i + 1), {key:'__load', label:'Load', type:'load', width:'narrow'}, ...cols.slice(i + 1)];
  if ((inv.items || []).some(r => r.oversize)) { const a = cols.findIndex(c => c.type === 'amount'), os = {key:'__over', label:`Oversize +${pricing(inv).oversizePct}%`, type:'over', width:'normal'};
    cols = a < 0 ? [...cols, os] : [...cols.slice(0, a), os, ...cols.slice(a)]; }
  return cols;
}
function cellText(col, row, inv){
  if (col.type === 'load') { const n = loadNo(inv, row); return n ? String(n) : ''; }
  if (col.type === 'over') { const o = rowOver(inv, row); return row.oversize ? money(o, inv.currency) : ''; }
  const v = (row.values || {})[col.key];
  if (col.type === 'amount') return money(rowAmount(inv, row.values || {}, row), inv.currency);
  if (col.type === 'waiting') { const w = waitInfo(inv, row.values || {}); return w.charge ? `${fmtHM(w.over)} hr\n${money(w.charge, inv.currency)}` : ''; }
  if (col.type === 'date') { const d = parseISO(v); return d ? `${DAYS[d.getDay()]} ${fmtDate(v).slice(0,6)}${fmtDate(v).slice(8)}` : ''; }
  if (col.type === 'money') return v === '' || v == null ? '' : money(num(v), inv.currency);
  return v == null ? '' : String(v);
}
const isRight = c => ['number','weight','money','amount','waiting','over'].includes(c.type);

/* ---------- navigation ---------- */
function go(view, id){ state.view = view; state.viewId = id ?? null; if (view !== 'edit') state.draft = null; if (view !== 'settings') state.settingsDraft = null; render(); window.scrollTo(0,0); }
function softRender(){ if (['invoices','companies','preview'].includes(state.view) && !state.modal) render(); else updateHeader(); }
function updateHeader(){
  $('#bizName').textContent = 'Wharf invoices';
  const navView = state.view === 'preview' || state.view === 'edit' ? 'invoices' : state.view;
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === navView ? 'true' : 'false'));
  const out = $('#hdrOut'); if (out) out.hidden = !(state.ready && !state.auth && (Store.fbAuth?.currentUser || Store.mode === 'server'));
}
function render(){
  updateHeader();
  const app = $('#app');
  if (!state.ready) { if (Store.mode !== 'loading') app.innerHTML = '<div class="loading">Loading your invoices…</div>'; return; }
  if (state.auth) { app.innerHTML = viewLogin(); $('#modal').innerHTML = ''; return; }
  if (state.loadError) { app.innerHTML = `<div class="panel empty" style="margin-top:20px"><h2>Can't reach your invoices</h2><p class="muted" style="margin:0">${esc(state.loadError)}. Check your internet connection.</p><button class="btn primary" data-action="retry-load">Try again</button></div>`; return; }
  const v = state.view;
  app.innerHTML = v === 'companies' ? viewCompanies() : v === 'settings' ? viewSettings() : v === 'edit' ? viewEditor()
    : v === 'preview' ? viewPreview() : viewInvoices();
  renderModal();
}

/* ---------- view: invoices ---------- */
function viewInvoices(){
  const cur = state.settings.invoice.currency;
  const all = state.invoices.slice().sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')) || String(b.number).localeCompare(String(a.number)));
  const outstanding = all.filter(i => statusOf(i) !== 'paid').reduce((s,i) => s + totals(i).total, 0);
  const overdueN = all.filter(i => statusOf(i) === 'overdue').length;
  const ym = isoToday().slice(0,7);
  const month = all.filter(i => String(i.date||'').startsWith(ym)).reduce((s,i) => s + totals(i).total, 0);
  const paid = all.filter(i => statusOf(i) === 'paid').reduce((s,i) => s + totals(i).total, 0);
  const q = state.q.trim().toLowerCase();
  const list = all.filter(i => (state.filter === 'all' || statusOf(i) === state.filter || (state.filter === 'unpaid' && statusOf(i) === 'overdue'))
    && (!q || [i.number, i.billTo?.name, i.weekEnding, fmtDate(i.weekEnding)].join(' ').toLowerCase().includes(q)));
  const chip = (k, t) => `<button class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${t}</button>`;
  return `
  <div class="page-head">
    <div><div class="eyebrow">Ledger</div><h1>Invoices</h1></div>
    <div class="actions"><button class="btn accent" data-action="new-invoice">${ICON.plus}New weekly invoice</button></div>
  </div>
  ${setupNotice()}
  <div class="stats">
    <div class="stat"><span class="eyebrow">Outstanding</span><b>${money(outstanding, cur)}</b><span class="muted" style="font-size:12.5px">${overdueN ? overdueN + ' overdue' : 'Nothing overdue'}</span></div>
    <div class="stat"><span class="eyebrow">Billed this month</span><b>${money(month, cur)}</b></div>
    <div class="stat"><span class="eyebrow">Paid to date</span><b>${money(paid, cur)}</b></div>
  </div>
  <div class="toolbar">
    <input class="in" id="q" type="search" placeholder="Search invoice no., company or week" value="${esc(state.q)}">
    <div class="chips">${chip('all','All')}${chip('unpaid','Unpaid')}${chip('overdue','Overdue')}${chip('paid','Paid')}</div>
  </div>
  ${all.length === 0 ? `<div class="panel empty">${ICON.doc}<h2>No invoices yet</h2><p class="muted" style="margin:0;max-width:40ch">Add the companies you work for, then create your first weekly invoice. Each one is saved here so you can edit, re-download or delete it later.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-nav="companies">Add a company</button><button class="btn accent" data-action="new-invoice">New weekly invoice</button></div></div>`
  : list.length === 0 ? `<div class="panel empty"><p class="muted" style="margin:0">No invoices match this filter.</p></div>`
  : `<div class="ilist">
      <div class="irow ihead"><span>Invoice</span><span>Company</span><span class="c-week">Week ending</span><span style="text-align:right">Total</span><span>Status</span></div>
      ${list.map(i => { const st = statusOf(i); return `
      <button class="irow" data-open="${esc(i.id)}">
        <span class="no">${esc(i.number)}</span>
        <span class="c-main" style="min-width:0"><div class="co">${esc(i.billTo?.name || 'No company')}${i.example ? ' <span class="muted" style="font-weight:400">(example)</span>' : ''}</div><div class="sub">Issued ${fmtDate(i.date)}${i.dueDate ? ' · due ' + fmtDate(i.dueDate) : ''}</div></span>
        <span class="c-week sub num">${fmtDate(i.weekEnding) || '—'}</span>
        <span class="amt">${money(totals(i).total, i.currency)}</span>
        <span class="pillwrap"><span class="pill ${st}">${STATUS_TEXT[st]}</span></span>
      </button>`; }).join('')}
    </div>`}`;
}
function setupNotice(){
  if (state.settings.business.name) return '';
  return `<div class="notice ex" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
    <span>Add your business name, ABN and bank details once in Settings. They print on every invoice.</span>
    <button class="btn sm" data-nav="settings">Open Settings</button></div>`;
}

/* ---------- view: editor ---------- */
function newDraft(companyId){
  const s = state.settings, inv = s.invoice;
  const used = new Set(state.invoices.map(i => i.number));
  let n = Math.max(1, Number(inv.nextNumber) || 1), number;
  do { number = inv.prefix + String(n).padStart(4, '0'); n++; } while (used.has(number));
  const date = isoToday();
  const d = {id:null, number, date, dueDate: addDays(date, Number(inv.dueDays) || 0), weekEnding: nextSunday(),
    companyId:'', billTo:{name:'', contact:'', abn:'', address:'', email:'', phone:'', ref:''},
    columns: clone(s.columns), items:[], notes: inv.notes, status:'unpaid',
    waiting: {freeMinutes: num(s.rates.freeMinutes), hourly: num(s.rates.hourly), blockMinutes: num(s.rates.blockMinutes)},
    pricing: {perTonne: !!s.rates.perTonne, minTonnes: num(s.rates.minTonnes), fuelLevy: num(s.rates.fuelLevy), oversizePct: num(s.rates.oversizePct)},
    taxEnabled: !!inv.taxEnabled, taxLabel: inv.taxLabel, taxRate: num(inv.taxRate), currency: inv.currency, title: inv.title};
  if (companyId) applyCompany(d, companyId);
  d.items.push(blankRow(d));
  return d;
}
function blankRow(d, date){
  const values = {};
  d.columns.forEach(c => { values[c.key] = ''; });
  const dateCol = d.columns.find(c => c.type === 'date'); if (dateCol) values[dateCol.key] = date || '';
  const co = state.companies.find(c => c.id === d.companyId);
  const rateCol = d.columns.find(c => c.type === 'money' && c.multiply);
  if (rateCol && co && co.defaultRate) values[rateCol.key] = String(co.defaultRate);
  const last = d.items[d.items.length - 1];
  if (last) d.columns.forEach(c => { if (c.type === 'money' && c.multiply && last.values[c.key]) values[c.key] = last.values[c.key]; });
  return {id: uid(), values};
}
function applyCompany(d, id){
  const c = state.companies.find(x => x.id === id);
  d.companyId = id || '';
  d.billTo = c ? {name:c.name||'', contact:c.contact||'', abn:c.abn||'', address:c.address||'', email:c.email||'', phone:c.phone||'', ref:c.ref||''}
               : {name:'', contact:'', abn:'', address:'', email:'', phone:'', ref:''};
  const rateCol = d.columns.find(col => col.type === 'money' && col.multiply);
  if (c && c.defaultRate && rateCol) d.items.forEach(r => { if (!r.values[rateCol.key]) r.values[rateCol.key] = String(c.defaultRate); });
}

function itemRow(d, r, i){

}
// Pick list for the Suburb box: every suburb on the rate card with its rate, narrowed by what's typed.
function showSugg(inp){
  const box = document.querySelector(`[data-sugg="${inp.dataset.row}"]`); if (!box) return;
  const q = inp.value.trim().toLowerCase();
  const all = (state.settings.rates.card || []).flatMap(r => zoneSuburbs(r.suburb).map(name => ({name, rate: r.rate})));
  const list = all.filter(x => !q || x.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length || (list.length === 1 && list[0].name.toLowerCase() === q)) { box.hidden = true; return; }
  box.innerHTML = list.map(x => `<button type="button" data-pick-sub="${esc(x.name)}" data-pick-row="${inp.dataset.row}"><span>${esc(x.name)}</span><span class="num muted">${money(num(x.rate), state.draft?.currency || '$')}</span></button>`).join('');

}

async function saveDraft(){
  const d = state.draft;
  if (!d.number.trim()) { toast('Give the invoice a number before saving.'); return null; }
  if (state.invoices.some(i => i.number === d.number.trim() && i.id !== d.id)) { toast(`Invoice ${d.number} already exists. Use a different number.`); return null; }
  // Lines with nothing filled in apart from the date or rate are left off the invoice.
  const filled = r => d.columns.some(c => !['date','money','amount','waiting'].includes(c.type) && String(r.values[c.key] ?? '').trim());
  if (d.items.some(r => !filled(r))) d.items = d.items.filter(filled);
  const isNew = !d.id; const id = d.id || uid();
  const t = totals(d);
  const data = {...clone(d), id, number: d.number.trim(), subtotal: t.subtotal, tax: t.tax, total: t.total, updatedAt: new Date().toISOString()};
  if (isNew) data.createdAt = data.updatedAt;
  delete data.example;
  const ok = await safe(Store.put('invoices', id, data));
  if (!ok) return null;
  if (isNew) {
    const m = data.number.match(/(\d+)\s*$/); const s = state.settings;
    if (m && data.number.startsWith(s.invoice.prefix) && Number(m[1]) >= Number(s.invoice.nextNumber)) {
      const ns = clone(s); ns.invoice.nextNumber = Number(m[1]) + 1; safe(Store.putSettings(ns));
    }
  }
  return state.invoices.find(i => i.id === id);
}

/* ---------- PDF ---------- */
function buildPDF(inv){
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error('The PDF tool did not load. Check your connection and reload.');
  const s = state.settings, biz = s.business, bank = s.bank, t = totals(inv), b = inv.billTo || {};
  const cols = outCols(inv);
  const doc = new J({unit:'mm', format:'a4'});
  const W = 210, M = 16, NAVY = [21,24,28], RED = [225,0,0], GREY = [94,110,125], INK = [20,32,43];
  try { doc.addImage(LOGO, 'PNG', M, M - 4, 24, 24 * 87 / 143); } catch(e) {}
  let y = M + 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...NAVY);
  const bizName = doc.splitTextToSize(biz.name || 'Your Business Name', 95);
  doc.text(bizName, M, y);
  doc.setFontSize(22); doc.text(inv.title || s.invoice.title, W - M, M + 4, {align:'right'});
  let ly = y + bizName.length * 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(62,76,89);
  [biz.abn && 'ABN ' + biz.abn, ...(String(biz.address||'').split('\n')), biz.phone, biz.email].filter(Boolean).forEach(l => { doc.text(String(l), M, ly); ly += 4.6; });
  let ry = M + 14;
  const meta = [['Invoice no.', inv.number], ['Date', fmtDate(inv.date)], inv.weekEnding && ['Week ending', fmtDate(inv.weekEnding)], inv.dueDate && ['Due date', fmtDate(inv.dueDate)], b.ref && ['Reference', b.ref]].filter(Boolean);
  meta.forEach(([k, v]) => { doc.setFont('helvetica','normal'); doc.setTextColor(...GREY); doc.text(k, W - M - 34, ry, {align:'right'});
    doc.setFont('helvetica','bold'); doc.setTextColor(...INK); doc.text(String(v), W - M, ry, {align:'right'}); ry += 5; });
  y = Math.max(ly, ry) + 4;
  doc.setFillColor(...NAVY); doc.rect(M, y, W - 2*M, 0.9, 'F'); doc.setFillColor(...RED); doc.rect(M, y + 0.9, W - 2*M, 0.9, 'F'); y += 9;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...GREY); doc.text('BILL TO', M, y); y += 5;
  doc.setFontSize(11.5); doc.setTextColor(...INK); doc.text(b.name || '-', M, y); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(62,76,89);
  [b.contact && 'Attn: ' + b.contact, ...(String(b.address||'').split('\n')), b.abn && 'ABN ' + b.abn, b.email, b.phone].filter(Boolean).forEach(l => { doc.text(String(l), M, y); y += 4.6; });
  y += 3;
  const tw = cols.reduce((a,c) => a + (WIDTH_W[c.width] || 1.6), 0), avail = W - 2*M;
  const columnStyles = {};
  cols.forEach((c, i) => { columnStyles[i] = {cellWidth: (WIDTH_W[c.width] || 1.6) / tw * avail, halign: isRight(c) ? 'right' : 'left'}; });
  doc.autoTable({
    startY: y, margin:{left:M, right:M},
    head: [cols.map(c => c.label)],
    body: (inv.items||[]).map(r => cols.map(c => cellText(c, r, inv))),
    styles:{font:'helvetica', fontSize: cols.length > 8 ? 7.8 : 9, cellPadding: cols.length > 8 ? 1.6 : 2.2, textColor:INK, lineColor:[225,230,235], lineWidth:{bottom:0.2}},
    headStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize: cols.length > 8 ? 7.5 : 9},
    alternateRowStyles:{fillColor:[245,247,249]},
    columnStyles,
    didParseCell: data => { if (data.section === 'head' && isRight(cols[data.column.index])) data.cell.styles.halign = 'right'; }
  });
  y = doc.lastAutoTable.finalY + 7;
  if (y > 250) { doc.addPage(); y = M + 6; }
  const tx = W - M - 72;
  const line = (k, v, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(bold ? 12 : 10); doc.setTextColor(...(bold ? NAVY : INK));
    doc.text(k, tx, y); doc.text(v, W - M, y, {align:'right'}); y += bold ? 7 : 5.5; };
  totalRows(inv, t).forEach(([k, v]) => line(k, money(v, inv.currency)));
  doc.setFillColor(...NAVY); doc.rect(tx, y - 3, W - M - tx, 0.7, 'F'); y += 3.5;
  line('Total due', money(t.total, inv.currency), true);
  if (inv.status === 'paid') { doc.setDrawColor(29,122,76); doc.setTextColor(29,122,76); doc.setLineWidth(0.6); doc.roundedRect(W - M - 26, y - 2, 26, 9, 1, 1);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('PAID', W - M - 13, y + 4.4, {align:'center'}); y += 12; }
  let fy = Math.max(y + 10, 240);
  if (fy > 270) { doc.addPage(); fy = M + 6; }
  const half = (W - 2*M) / 2 - 4;
  const block = (x, title, lines) => { if (!lines.length) return; let yy = fy;
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...GREY); doc.text(title, x, yy); yy += 5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    lines.forEach(l => { doc.splitTextToSize(String(l), half).forEach(p => { doc.text(p, x, yy); yy += 4.6; }); }); };
  block(M, 'PAYMENT DETAILS', [bank.accountName && 'Account name: ' + bank.accountName, bank.bankName && 'Bank: ' + bank.bankName, bank.bsb && 'BSB: ' + bank.bsb, bank.accountNumber && 'Account: ' + bank.accountNumber].filter(Boolean));
  block(M + half + 8, 'NOTES', String(inv.notes||'').split('\n').filter(x => x.trim()));
  return doc;
}
async function downloadPDF(inv){
  let blob;
  try { blob = buildPDF(inv).output('blob'); } catch(e) { toast(e.message); return; }
  const name = `Invoice ${inv.number} ${inv.billTo?.name || ''}`.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.pdf';
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e) { dl = null; }
  if (dl) {
    try { await dl.save({filename: name, data: blob}); toast('PDF saved'); }
    catch(e) { if (e && e.code !== 'declined') toast('Could not save the PDF: ' + (e.message || e.code)); }
    return;
  }
  saveFile(blob, name);
}
// Sends the invoice PDF to the review address. A web page can't attach files to an email by itself, so:
// on phones the PDF goes to the share sheet (pick Mail, paste the copied address); on a computer the PDF
// downloads and an email to the review address opens ready for it to be attached.
async function emailReview(inv){
  const to = String(state.settings.invoice.reviewEmail || '').trim();
  if (!to) { toast('Add a review email in Settings first.'); return; }
  let blob; try { blob = buildPDF(inv).output('blob'); } catch(e) { toast(e.message); return; }
  const name = `Invoice ${inv.number} ${inv.billTo?.name || ''}`.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.pdf';
  const t = totals(inv), subject = `Invoice ${inv.number} for review${inv.billTo?.name ? ' - ' + inv.billTo.name : ''}`;
  const body = [`Please review invoice ${inv.number}.`, '', `Bill to: ${inv.billTo?.name || '-'}`, inv.weekEnding ? `Week ending: ${fmtDate(inv.weekEnding)}` : '',
    `Loads: ${(inv.items || []).length}`, `Total: ${money(t.total, inv.currency)}`, '', 'PDF attached.'].filter(x => x !== null).join('\n');
  const file = new File([blob], name, {type: 'application/pdf'});
  const mobile = /iPhone|iPad|iPod|Android/.test(navigator.userAgent);
  if (mobile && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.clipboard?.writeText(to); } catch(e) {}
    toast(`${to} copied. Choose Mail, then paste it in To.`);
    try { await navigator.share({files:[file], title: subject, text: body}); } catch(e) { if (e?.name !== 'AbortError') toast('Could not open sharing: ' + e.message); }
    return;
  }
  saveFile(blob, name);
  setTimeout(() => { location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }, 600);
  toast(`PDF downloaded. Attach ${name} to the email that opens.`);
}
// WhatsApp links can carry text but not files: on phones the PDF goes to the share sheet (pick WhatsApp);
// on a computer the PDF downloads and a WhatsApp chat with the saved number opens for it to be dropped in.
async function whatsappPDF(inv){
  let blob; try { blob = buildPDF(inv).output('blob'); } catch(e) { toast(e.message); return; }
  const name = `Invoice ${inv.number} ${inv.billTo?.name || ''}`.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.pdf';
  const t = totals(inv), text = `Invoice ${inv.number}${inv.billTo?.name ? ' - ' + inv.billTo.name : ''}${inv.weekEnding ? ', week ending ' + fmtDate(inv.weekEnding) : ''}. Total ${money(t.total, inv.currency)}. PDF attached.`;
  let num = String(state.settings.invoice.whatsapp || state.settings.business.phone || '').replace(/\D/g, ''); if (num.startsWith('0')) num = '61' + num.slice(1);
  const file = new File([blob], name, {type: 'application/pdf'});
  if (/iPhone|iPad|iPod|Android/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})) {
    toast('Choose WhatsApp, then pick the chat.');
    try { await navigator.share({files:[file], text}); } catch(e) { if (e?.name !== 'AbortError') toast('Could not open sharing: ' + e.message); }
    return;
  }

  const w = window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`, '_blank');
  toast(w ? `PDF downloaded. Drag ${name} into the WhatsApp chat that opens.` : 'PDF downloaded. Your browser blocked WhatsApp from opening, so tap the green WhatsApp button once more.');
}
// Outside Claude: on iPhone/iPad, hand the file to the share sheet (Save to Files, Mail, Messages); elsewhere download it.
async function saveFile(blob, name){
  try {
    const file = new File([blob], name, {type: blob.type});
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  catch(e) { toast('Downloads are not available in this view.'); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-close-modal], [data-open]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.closeModal !== undefined && e.target === el) { closeModal(); return; }
  if (ds.nav) { if (state.view === 'edit' && ds.nav !== 'edit') state.draft = null; go(ds.nav); return; }
  if (ds.filter) { state.filter = ds.filter; render(); return; }
  if (ds.open) { go('preview', ds.open); return; }
  if (ds.newFor) { state.draft = newDraft(ds.newFor); go('edit'); state.draft = state.draft; return; }
  if (ds.editCompany) { state.modal = {type:'company', id: ds.editCompany}; renderModal(); return; }
  if (ds.delCompany) { const c = state.companies.find(x => x.id === ds.delCompany);

  if (ds.editInv) { const inv = state.invoices.find(i => i.id === ds.editInv); if (inv) { state.view = 'edit'; state.draft = clone(inv); render(); window.scrollTo(0,0); } return; }
  if (ds.dupInv) { const src = state.invoices.find(i => i.id === ds.dupInv); if (!src) return;
    const d = newDraft(); const keep = {number:d.number, date:d.date, dueDate:d.dueDate};
    Object.assign(d, clone(src), keep, {id:null, status:'unpaid', weekEnding: src.weekEnding ? addDays(src.weekEnding, 7) : d.weekEnding});
    delete d.example; delete d.createdAt;
    d.items = d.items.map(r => { const v = {...r.values}; d.columns.forEach(c => { if (c.type === 'date' && v[c.key]) v[c.key] = addDays(v[c.key], 7); }); return {id: uid(), values: v}; });
    state.view = 'edit'; state.draft = d; render(); window.scrollTo(0,0); toast('Copied with dates moved forward one week'); return; }
  if (ds.togglePaid) { const inv = state.invoices.find(i => i.id === ds.togglePaid); if (!inv) return;
    await safe(Store.put('invoices', inv.id, {...inv, status: inv.status === 'paid' ? 'unpaid' : 'paid'}), inv.status === 'paid' ? 'Marked unpaid' : 'Marked paid'); render(); return; }
  if (ds.delInv) { const inv = state.invoices.find(i => i.id === ds.delInv);
    confirmBox(`Delete invoice ${inv?.number || ''}?`, 'This removes it for good. Download the PDF first if you need a copy.', 'Delete invoice', async () => { await safe(Store.del('invoices', ds.delInv), 'Invoice deleted'); go('invoices'); }); return; }
  if (ds.wa) { const inv = state.invoices.find(i => i.id === ds.wa); if (inv) whatsappPDF(inv); return; }
  if (ds.review) { const inv = state.invoices.find(i => i.id === ds.review); if (inv) emailReview(inv); return; }
  if (ds.pdf) { const inv = state.invoices.find(i => i.id === ds.pdf); if (inv) downloadPDF(inv); return; }
  if (ds.delRow) { const d = state.draft; d.items = d.items.filter(r => r.id !== ds.delRow); rerenderItems(); return; }
  if (ds.addLoad) { const d = state.draft; const r = d.items.find(x => x.id === ds.addLoad); if (!r) return;
    const dc = d.columns.find(c => c.type === 'date'), day = r.values[dc.key];
    const keep = d.columns.filter(c => c.type === 'date' || c.type === 'suburb' || (c.type === 'money' && c.multiply) || /customer/i.test(c.label));
    const values = {}; d.columns.forEach(c => { values[c.key] = keep.includes(c) ? (r.values[c.key] ?? '') : ''; });
    let at = d.items.indexOf(r); if (day) d.items.forEach((x, i) => { if (x.values[dc.key] === day && i > at) at = i; });
    const row = {id: uid(), values}; d.items.splice(at + 1, 0, row); rerenderItems();
    const n = loadNo(d, row); if (n) toast(`Load ${n} added for ${fmtDate(day)}`);
    document.querySelector(`[data-load="${row.id}"]`)?.closest('.item')?.scrollIntoView({block:'center', behavior:'smooth'}); return; }
  if (ds.dupRow) { const d = state.draft; const i = d.items.findIndex(r => r.id === ds.dupRow); const r = d.items[i];
    const v = {...r.values}; d.columns.forEach(c => { if (c.type === 'date' && v[c.key]) v[c.key] = addDays(v[c.key], 1); });
    d.items.splice(i + 1, 0, {id: uid(), values: v, oversize: !!r.oversize}); rerenderItems(); return; }
  if (ds.colMove) { const s = state.settingsDraft, i = +ds.colMove, j = i + (+ds.dir); [s.columns[i], s.columns[j]] = [s.columns[j], s.columns[i]]; render(); return; }
  if (ds.pickSub !== undefined) { const inp = document.querySelector(`[data-row="${ds.pickRow}"][data-type="suburb"]`);
    if (inp) { inp.value = ds.pickSub; inp.dispatchEvent(new Event('input', {bubbles: true})); }
    const box = document.querySelector(`[data-sugg="${ds.pickRow}"]`); if (box) box.hidden = true; return; }
  if (ds.addRcRow) { const d = state.draft; const r = d.items.find(x => x.id === ds.addRcRow); if (!r) return;
    const sc = d.columns.find(c => c.type === 'suburb'), rc = d.columns.find(c => c.type === 'money' && c.multiply);
    const suburb = String(r.values[sc.key] || '').trim(), rate = rc ? num(r.values[rc.key]) : 0;
    if (!rate) { toast(`Type the rate for ${suburb} on this line first, then tap Add to rate card.`); return; }
    const ns = clone(state.settings); ns.rates.card = [...(ns.rates.card || []), {suburb, rate}];
    if (await safe(Store.putSettings(ns), `${suburb} added to the rate card at ${money(rate, d.currency)}`)) {
      const dl = $('#suburbList'); if (dl) dl.insertAdjacentHTML('beforeend', `<option value="${esc(suburb)}">`);
      d.items.forEach(x => { const h = document.querySelector(`[data-sub-hint="${x.id}"]`); if (h) h.innerHTML = subHint(x, x.values[sc.key]); }); }
    return; }
  if (ds.rcDel) { state.settingsDraft.rates.card.splice(+ds.rcDel, 1); render(); return; }
  if (ds.colDel) { const s = state.settingsDraft; if (s.columns.length <= 1) { toast('Keep at least one column.'); return; } s.columns.splice(+ds.colDel, 1); render(); return; }

  switch (ds.action) {
    case 'new-invoice': state.view = 'edit'; state.draft = newDraft(); render(); window.scrollTo(0,0); break;
    case 'cancel-edit': { const id = state.draft?.id; go(id ? 'preview' : 'invoices', id); break; }
    case 'add-row': state.draft.items.push(blankRow(state.draft)); rerenderItems(); break;
    case 'fill-week': { const d = state.draft; const end = d.weekEnding || nextSunday();
      const dateCol = d.columns.find(c => c.type === 'date');
      const have = new Set(dateCol ? d.items.map(r => r.values[dateCol.key]) : []);
      d.items = d.items.filter(r => Object.values(r.values).some(v => String(v).trim()) && !(dateCol && Object.entries(r.values).every(([k,v]) => k === dateCol.key || !String(v).trim()) && !r.values[dateCol.key]));
      for (let i = 6; i >= 2; i--) { const day = addDays(end, -i); if (!have.has(day)) d.items.push(blankRow(d, day)); }
      if (dateCol) d.items.sort((a,b) => String(a.values[dateCol.key]||'9').localeCompare(String(b.values[dateCol.key]||'9')));
      rerenderItems(); toast('Added Monday to Friday. Use Add line for a weekend day. Days left empty are left off the invoice.'); break; }
    case 'use-current-cols': { const d = state.draft; const old = d.columns; d.columns = clone(state.settings.columns);
      d.items = d.items.map(r => { const v = {}; d.columns.forEach(c => { const o = old.find(x => x.key === c.key); v[c.key] = o ? (r.values[c.key] ?? '') : ''; }); return {id:r.id, values:v}; });
      render(); break; }
    case 'save-preview': { const inv = await saveDraft(); if (inv) { toast('Invoice saved'); go('preview', inv.id); } break; }
    case 'save-pdf': { const inv = await saveDraft(); if (inv) { go('preview', inv.id); downloadPDF(inv); } break; }
    case 'save-wa': { const inv = await saveDraft(); if (inv) { go('preview', inv.id); whatsappPDF(inv); } break; }
    case 'save-review': { const inv = await saveDraft(); if (inv) { go('preview', inv.id); emailReview(inv); } break; }
    case 'add-company': state.modal = {type:'company'}; renderModal(); break;
    case 'add-company-inline': state.modal = {type:'company', inline:true}; renderModal(); break;
    case 'modal-cancel': closeModal(); break;
    case 'modal-ok': { const fn = state.modal?.fn; closeModal(); if (fn) fn(); break; }
    case 'save-settings': { const s = state.settingsDraft; s.invoice.nextNumber = Math.max(1, parseInt(s.invoice.nextNumber) || 1); s.invoice.dueDays = Math.max(0, parseInt(s.invoice.dueDays) || 0); s.invoice.taxRate = num(s.invoice.taxRate);
      s.rates.freeMinutes = Math.max(0, parseInt(s.rates.freeMinutes) || 0); s.rates.hourly = num(s.rates.hourly);
      s.rates.blockMinutes = Math.max(0, parseInt(s.rates.blockMinutes) || 0); s.rates.minTonnes = num(s.rates.minTonnes); s.rates.fuelLevy = num(s.rates.fuelLevy); s.rates.oversizePct = num(s.rates.oversizePct);
      s.rates.card = (s.rates.card || []).filter(r => String(r.suburb).trim()).map(r => ({suburb: String(r.suburb).trim(), rate: num(r.rate)}));
      if (await safe(Store.putSettings(s), 'Settings saved')) { state.settingsDraft = clone(state.settings); render(); } break; }
    case 'logout': if (Store.fbAuth) { await Store.fbAuth.signOut(); break; } await Store.api('POST', '/api/logout').catch(() => {}); state.auth = {setup:false}; render(); break;
    case 'reset-pw': { const email = ($('#au-email')?.value || Store.fbAuth?.currentUser?.email || '').trim();
      if (!email) { toast('Type your email first.'); break; }
      try { await Store.fbAuth.sendPasswordResetEmail(email); toast('Reset link sent to ' + email); } catch(x) { toast(x.message); } break; }
    case 'retry-load': state.loadError = null; state.ready = false; if (Store.mode === 'server') Store.load(); else location.reload(); break;
    case 'add-rc': state.settingsDraft.rates.card = state.settingsDraft.rates.card || []; state.settingsDraft.rates.card.unshift({suburb:'', rate:''}); render(); $('[data-rc="0"][data-prop="suburb"]')?.focus(); break;
    case 'add-col': state.settingsDraft.columns.push({key: 'c' + uid(), label:'New column', type:'text', width:'normal', multiply:false}); render(); break;
    case 'reset-cols': state.settingsDraft.columns = clone(DEFAULT_COLUMNS); render(); break;
    case 'export': { const data = JSON.stringify({app:'wharf-invoices', version:1, exportedAt:new Date().toISOString(), settings:state.settings, companies:state.companies, invoices:state.invoices}, null, 2);
      let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch(e) {}
      if (dl) { try { await dl.save({filename:`wharf-invoices-backup-${isoToday()}.json`, data}); toast('Backup saved'); } catch(e) { if (e?.code !== 'declined') toast('Could not save the backup.'); } }
      else saveFile(new Blob([data], {type:'application/json'}), `wharf-invoices-backup-${isoToday()}.json`);

  const d = state.draft;
  if (d) {
    if (ds.row) { const r = d.items.find(x => x.id === ds.row); if (!r) return; r.values[ds.key] = t.value;
      if (ds.type === 'suburb') { const rate = rateFor(t.value); const rc = d.columns.find(c => c.type === 'money' && c.multiply);
        if (rate != null && rc) { r.values[rc.key] = String(rate); const inp = document.querySelector(`[data-row="${r.id}"][data-key="${rc.key}"]`); if (inp) inp.value = rate; }
        const h = document.querySelector(`[data-sub-hint="${r.id}"]`); if (h) h.innerHTML = subHint(r, t.value); showSugg(t); }
      refreshTotals(); return; }
    if (ds.bill) { d.billTo[ds.bill] = t.value; return; }
    if (t.id === 'notes') { d.notes = t.value; return; }
    if (t.id && t.id.startsWith('f-') && !['f-tax','f-paid'].includes(t.id)) { d[t.id.slice(2)] = t.value; return; }
  }
  const s = state.settingsDraft;
  if (s) {
    if (ds.set) { const [g, k] = ds.set.split('.'); s[g][k] = t.type === 'checkbox' ? t.checked : t.value; return; }
    if (ds.col !== undefined && ds.prop === 'label') { s.columns[+ds.col].label = t.value; return; }
    if (ds.rc !== undefined) { s.rates.card[+ds.rc][ds.prop] = t.value; return; }
  }
});
document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset, d = state.draft, s = state.settingsDraft;
  if (t.id === 'pickCompany' && d) { applyCompany(d, t.value); render(); toast(t.value ? 'Company details copied in' : 'Bill-to cleared'); return; }
  if (t.id === 'f-tax' && d) { d.taxEnabled = t.checked; refreshTotals(); return; }
  if (ds.overRow && d) { const r = d.items.find(x => x.id === ds.overRow); if (r) { r.oversize = t.checked; t.closest('.item')?.classList.toggle('over', t.checked); refreshTotals(); } return; }
  if (t.id === 'f-paid' && d) { d.status = t.checked ? 'paid' : 'unpaid'; return; }
  if (t.id === 'f-date' && d) { d.date = t.value; return; }
  if (s && ds.col !== undefined && ds.prop) {
    const c = s.columns[+ds.col];
    if (ds.prop === 'multiply') c.multiply = t.checked;
    else if (ds.prop === 'type') { if (['amount','waiting','suburb'].includes(t.value) && s.columns.some((x, i) => x.type === t.value && i !== +ds.col)) { toast(`Only one ${TYPE_LABEL[t.value]} column is allowed.`); render(); return; }
      c.type = t.value; if (!['number','money'].includes(c.type)) c.multiply = false; render(); }
    else if (ds.prop === 'width') c.width = t.value;
    return;
  }
  if (s && t.id === 'perTonne') { s.rates.perTonne = t.value === '1'; return; }
  if (s && ds.set && t.type === 'checkbox') { const [g, k] = ds.set.split('.'); s[g][k] = t.checked; return; }
  if (t.id === 'importFile' && t.files[0]) {
    try {
      const data = JSON.parse(await t.files[0].text());
      if (data.app !== 'wharf-invoices') throw new Error('That file is not a Wharf Invoices backup.');
      // An update file only changes the settings it names and adds or updates rate card suburbs; everything else stays.
      if (data.merge) { const ns = clone(state.settings), u = data.settings || {};
        ['business','bank','invoice','rates'].forEach(g => { const { card, ...rest } = u[g] || {}; Object.assign(ns[g], rest); });
        (u.rates?.card || []).forEach(r => { const hit = ns.rates.card.find(x => String(x.suburb).trim().toLowerCase() === String(r.suburb).trim().toLowerCase()); if (hit) hit.rate = r.rate; else ns.rates.card.push(r); });
        await Store.putSettings(ns); state.settingsDraft = null; toast('Settings updated'); render(); t.value = ''; return; }
      if (data.settings) await Store.putSettings(data.settings);
      for (const c of data.companies || []) await Store.put('companies', c.id || uid(), c);
      for (const i of data.invoices || []) await Store.put('invoices', i.id || uid(), i);
      state.settingsDraft = null; toast(`Restored ${(data.invoices||[]).length} invoices and ${(data.companies||[]).length} companies`); render();
    } catch(err) { toast(err.message || 'Could not read that file.'); }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'authForm') {
    e.preventDefault();
    const err = $('#au-err'); err.hidden = true;
    try {
      if (state.auth.firebase) { await Store.fbAuth.signInWithEmailAndPassword($('#au-email').value.trim(), $('#au-pass').value); return; }
      await Store.api('POST', state.auth.setup ? '/api/setup' : '/api/login', {email: $('#au-email').value, password: $('#au-pass').value});
      state.auth = null; state.ready = false; await Store.load(); }
    catch(x) { const el = $('#au-err'); if (el) { el.textContent = /auth\/(invalid|wrong|user-not-found)/.test(x.code || '') ? 'Wrong email or password' : x.message; el.hidden = false; } }
    return;
  }
  if (e.target.id === 'pwForm') {
    e.preventDefault();
    if (await safe(Store.api('POST', '/api/me/password', {current: $('#pw-cur').value, next: $('#pw-new').value}), 'Password changed')) e.target.reset();
    return;
  }
  if (e.target.id !== 'companyForm') return;
  e.preventDefault();
  const m = state.modal; const get = k => ($('#co-' + k)?.value || '').trim();
  const data = {name:get('name'), contact:get('contact'), abn:get('abn'), address:$('#co-address').value.trim(), email:get('email'), phone:get('phone'), defaultRate:get('defaultRate'), ref:get('ref')};
  if (!data.name) { toast('Enter the company name.'); return; }
  const id = m.id || uid();
  closeModal();
  if (await safe(Store.put('companies', id, data), m.id ? 'Company updated' : 'Company added')) {
    state.companies.sort((a,b) => String(a.name).localeCompare(b.name));
    if (m.inline && state.draft) { applyCompany(state.draft, id); }
    render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) closeModal(); });

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.mode === 'server' && state.ready && !state.auth) Store.load(); });

updateHeader();
Store.init();
})();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</body>
